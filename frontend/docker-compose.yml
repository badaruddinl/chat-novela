services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CI: "true"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      PNPM_STORE_DIR: /pnpm-store
      BACKEND_URL: http://host.docker.internal:4000
    command: >
      sh -c "if [ ! -f /app/node_modules/.pnpm/lock.yaml ] || [ ! -d /app/frontend/node_modules ]; then pnpm install --frozen-lockfile; fi
      && pnpm --filter frontend dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm_store_frontend:/pnpm-store
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  pnpm_store_frontend:
