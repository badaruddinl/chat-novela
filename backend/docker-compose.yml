services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novela
      POSTGRES_PASSWORD: novela
      POSTGRES_DB: novela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://novela:novela@db:5432/novela
      CONTENT_ROOT: /app/frontend/src/contents
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      PORT: 4000
    ports:
      - "4000:4000"
    command: >
      sh -c "if [ ! -f /app/node_modules/.pnpm/lock.yaml ] || [ ! -d /app/backend/node_modules ]; then pnpm install --frozen-lockfile; fi
      && pnpm --filter backend dev"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    depends_on:
      - db

volumes:
  node_modules:
  postgres_data:
