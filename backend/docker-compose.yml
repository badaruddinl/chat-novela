services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CONTENT_ROOT: /app/frontend/src/contents
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      PNPM_STORE_DIR: /pnpm-store
      HOST: 0.0.0.0
      PORT: 4000
    ports:
      - "4000:4000"
    command: >
      sh -c "if [ ! -f /app/node_modules/.pnpm/lock.yaml ] || [ ! -d /app/backend/node_modules ]; then pnpm install --frozen-lockfile; fi
      && pnpm --filter backend dev"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm_store_backend:/pnpm-store

volumes:
  node_modules:
  pnpm_store_backend:
