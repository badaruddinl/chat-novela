services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then pnpm install; fi
      && pnpm dev -- -H 0.0.0.0 -p 3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/app/data

volumes:
  node_modules:
